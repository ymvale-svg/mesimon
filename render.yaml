# הגדרות פריסה לענן (Render). הקובץ הזה נקרא אוטומטית ומגדיר את השירות,
# את הדיסק הקבוע שעליו יושבים הנתונים, ואת גרסת Node.
# אין לערוך אותו אלא אם יודעים מה עושים.
services:
  - type: web
    name: mesimon
    runtime: node
    plan: standard         # 2GB זיכרון, 1 מעבד. נדרש תשלום — התוכנית החינמית מוחקת את הנתונים, ו-starter (512MB) קטנה מדי לסוכנים ולסריקת המייל
    region: frankfurt      # אירופה — הקרוב ביותר לישראל מבחינת זמן תגובה ורגולציה
    # אין תלויות npm. רק uv — לשני מקורות הנתונים שכתובים ב-Python (עסקאות נדל"ן, הלמ"ס).
    # מותקן לתוך תיקיית הפרויקט, כדי שיהיה זמין גם בזמן הריצה ולא רק בבנייה.
    buildCommand: "curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=$PWD/.bin UV_NO_MODIFY_PATH=1 sh"
    # תקרת זיכרון ל-Node מתחת למגבלת התוכנית (2GB), כדי שינקה זיכרון בזמן ולא
    # יגיע למגבלה של Render — חריגה שם = הפעלה מחדש ו-502 לכולם. כ-600MB נשארים
    # לשאר: שרתי הנתונים של הסוכנים (תהליכים נפרדים) וזיכרון שמחוץ ל-heap.
    # בתוכנית של 512MB — 320
    startCommand: PATH="$PWD/.bin:$PATH" node --max-old-space-size=1400 server/index.js
    healthCheckPath: /api/branding
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATA_DIR
        value: /var/mesimon/data
      - key: UPLOADS_DIR
        value: /var/mesimon/uploads
      - key: UV_CACHE_DIR            # מטמון של uv ושל Python שהוא מוריד — על הדיסק הקבוע, כדי שלא יורד שוב בכל הפעלה
        value: /var/mesimon/uv-cache
      - key: UV_PYTHON_INSTALL_DIR
        value: /var/mesimon/uv-python
      - key: npm_config_cache        # מטמון של npx לשרתי הנתונים
        value: /var/mesimon/npm-cache

      # הערכים של אלה נקבעים בלוח הבקרה ולא כאן — הם סודות ואין להם מקום בקוד.
      # sync: false אומר ל-Render לא לנהל אותם: בלעדיו סנכרון של הקובץ הזה
      # עלול למחוק משתנה שהוגדר ידנית, והתכונה שהוא מפעיל נעלמת בלי הודעה.
      - key: GOOGLE_CLIENT_ID      # כניסה עם Google — בלעדיו הכפתור פשוט לא מוצג
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_LOGIN_CLIENT_ID      # לקוח נפרד לכניסה (פרויקט External) — כשחיבור Gmail על פרויקט Internal
        sync: false
      - key: GOOGLE_LOGIN_CLIENT_SECRET
        sync: false
      - key: SMTP_HOST             # שליחת הזמנות ותזכורות בדואר
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_FROM_NAME
        sync: false
      - key: SMTP_REPLY_TO         # ברירת מחדל לכתובת התשובה, אם לא של המזמין
        sync: false
      - key: PUBLIC_URL            # נדרס על ידי ההגדרה "כתובת המערכת" במסך הניהול
        sync: false
      - key: ANTHROPIC_API_KEY     # משימות AI — בלעדיו האפשרות אינה מוצגת כזמינה
        sync: false
      - key: RUNPOD_API_KEY        # תמלול הודעות קוליות במודל העברית של ivrit.ai (RunPod) — ראשון בסדר
        sync: false
      - key: RUNPOD_ENDPOINT_ID    # מזהה ה-endpoint של ivrit-ai/runpod-serverless בחשבון ה-RunPod
        sync: false
      - key: OPENAI_API_KEY        # תמלול הודעות קוליות (OpenAI) — גיבוי ל-ivrit.ai
        sync: false
      - key: GOOGLE_SPEECH_API_KEY # חלופה ל-OpenAI: תמלול ב-Google Speech-to-Text
        sync: false
      - key: TOKEN_ENCRYPTION_KEY  # הצפנת חיבורי ה-Gmail במסד. נוצר פעם אחת — לא להחליף אחרי שחוברו תיבות
        generateValue: true
      - key: TIFUL360_INBOUND_KEY  # חיבור לתפעול 360 — המפתח שתפעול 360 שולח. בלעדיו החיבור כבוי
        sync: false
      - key: TIFUL360_API_URL      # כתובת it-api של תפעול 360 — לסגירת הקריאה כשהמשימה מסתיימת
        sync: false
      - key: TIFUL360_API_KEY
        sync: false
      - key: PRIORITY_USER         # קליטת מסמכי רכש מהבוט לפריוריטי — ה-PAT. בלעדיו היכולת כבויה
        sync: false
      - key: PRIORITY_PASSWORD     # בפריוריטי עם PAT: המילה PAT
        sync: false
      - key: PRIORITY_COMPANY      # קוד החברה בפריוריטי. בבדיקות: test11
        sync: false
    disk:
      name: mesimon-data   # הדיסק שורד עדכוני גרסה — כאן נשמרים מסד הנתונים והקבצים
      mountPath: /var/mesimon
      sizeGB: 5
