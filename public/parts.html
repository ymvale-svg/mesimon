<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>משימון — מק"טים לבנייה</title>
  <!-- 💬 מנהלת הרכש עונה לעובד על מק"טים לבנייה (server/priority/pd-parts.js). הקישור — מהמייל, בלי התחברות -->
  <style>
    :root { --bg: #f8fafc; --card: #fff; --fg: #1e293b; --muted: #64748b; --line: #e2e8f0; --brand: #115e59; --ok: #15803d; --bad: #b91c1c; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f172a; --card: #1e293b; --fg: #e2e8f0; --muted: #94a3b8; --line: #334155; --brand: #5eead4; --ok: #4ade80; --bad: #f87171; } }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--fg); margin: 0; line-height: 1.6; }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { color: var(--brand); margin: 0 0 4px; font-size: 1.4rem; }
    .muted { color: var(--muted); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-top: 14px; }
    .card h2 { margin: 0 0 4px; font-size: 1.05rem; }
    label { display: block; margin-top: 10px; font-size: .92rem; }
    input, textarea { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); margin-top: 4px; }
    input.ltr { direction: ltr; text-align: left; }
    button { margin-top: 12px; font: inherit; padding: 8px 16px; border: 0; border-radius: 8px; background: var(--brand); color: var(--bg); cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    .ok { color: var(--ok); font-weight: 600; }
    .err { color: var(--bad); }
    ul.answers { margin: 8px 0 0; padding-inline-start: 18px; font-size: .92rem; }
  </style>
</head>
<body>
<main>
  <h1>🆕 מק"טים לבנייה</h1>
  <p id="head" class="muted">טוען…</p>
  <div id="items"></div>
</main>
<script>
  const token = new URLSearchParams(location.search).get('t') || '';
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const qty = (n) => Number(n ?? 0).toLocaleString('he-IL', { maximumFractionDigits: 3 });

  function draw(v) {
    $('#head').innerHTML = `לבקשת <b>${esc(v.worker)}</b> · ${esc(v.company)}${v.project ? ` · ${esc(v.project)}` : ''}${v.supplier ? ` · ספק: ${esc(v.supplier)}` : ''}<br>`
      + (v.open ? '<b>פתחת מק"ט חדש בפריוריטי? אין צורך לכתוב כאן</b> — המערכת מזהה אותו לבד, והעובד מקבל הודעה בבוט.<br>כאן — רק כשהמק"ט <b>כבר היה קיים</b>, או כדי לכתוב לעובד הערה.' : '<span class="ok">✓ הבקשה טופלה — העובד כבר קיבל את המק"טים.</span>');
    $('#items').innerHTML = v.items.map((it) => `
      <section class="card" data-n="${it.n}">
        <h2>${esc(it.description)} — ${qty(it.qty)} ${esc(it.unit)}</h2>
        ${it.note ? `<div class="muted">${esc(it.note)}</div>` : ''}
        ${it.built ? `<div class="ok">✓ מק"ט: ${esc(it.built.code)} — ${esc(it.built.des)}</div>` : ''}
        ${it.answers.length ? `<ul class="answers">${it.answers.map((a) => `<li>${a.code ? `מק"ט ${esc(a.code)}` : ''}${a.code && a.note ? ' · ' : ''}${a.note ? `"${esc(a.note)}"` : ''} <span class="muted">(${new Date(a.at).toLocaleString('he-IL')})</span></li>`).join('')}</ul>` : ''}
        ${v.open ? `
          <label>מק"ט שכבר קיים<input class="ltr code" placeholder="למשל A120-035-010" autocomplete="off"></label>
          <label>הערה לעובד (לא חובה)<textarea class="note" rows="2" placeholder="למשל: זה אותו פריט כמו…"></textarea></label>
          <button type="button" class="send">שליחה ל${esc(v.worker)}</button> <span class="msg"></span>` : ''}
      </section>`).join('');
  }

  async function load() {
    const r = await fetch(`/api/priority/parts/${encodeURIComponent(token)}`);
    const v = await r.json().catch(() => ({}));
    if (!r.ok) { $('#head').innerHTML = `<span class="err">${esc(v.error || 'הקישור אינו תקין')}</span>`; return; }
    draw(v);
  }

  document.addEventListener('click', async (e) => {
    const b = e.target.closest('.send');
    if (!b) return;
    const card = b.closest('.card');
    const msg = card.querySelector('.msg');
    b.disabled = true; msg.textContent = 'שולח…'; msg.className = 'msg muted';
    try {
      const r = await fetch(`/api/priority/parts/${encodeURIComponent(token)}`, {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ n: Number(card.dataset.n), code: card.querySelector('.code').value, note: card.querySelector('.note').value })
      });
      const v = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(v.error || 'שגיאה');
      draw(v);
    } catch (err) {
      b.disabled = false; msg.textContent = err.message; msg.className = 'msg err';
    }
  });
  load();
</script>
</body>
</html>
